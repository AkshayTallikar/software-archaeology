name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: "End to end: ACME Billing (Python)"
        run: python -m archaeology demo --system billing --out out/billing
      - name: "End to end: Pinecrest Library (Node.js, stateful)"
        run: python -m archaeology demo --system library --out out/library
      - name: Upload evidence reports
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: evidence-reports
          path: |
            out/*/report.html
            out/*/brief.md
            out/*/equivalence.md
            out/*/probe.md
          if-no-files-found: warn
